<!-- =========================================================
     DIRECT BUTTON CONTROLLER
     
     THIS IS THE IMPORTANT PART.
     It connects the HTML buttons directly to scene.js.
     ========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "JARVIS: Button controller starting..."
        );


        /* =====================================================
           HELPER
           ===================================================== */

        function button(id) {

            return document.getElementById(id);

        }


        function safeCall(
            functionName,
            fallback
        ) {

            try {

                if (
                    typeof window[functionName] ===
                    "function"
                ) {

                    return window[functionName]();

                }

                console.warn(
                    "JARVIS: Function missing:",
                    functionName
                );

                if (fallback) {
                    fallback();
                }

            } catch (error) {

                console.error(
                    "JARVIS:",
                    functionName,
                    error
                );
            }
        }


        /* =====================================================
           CUBE
           ===================================================== */

        const cubeBtn =
            button("cubeBtn");


        if (cubeBtn) {

            cubeBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Cube button"
                    );

                    safeCall(
                        "createCube"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           SPHERE
           ===================================================== */

        const sphereBtn =
            button("sphereBtn");


        if (sphereBtn) {

            sphereBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Sphere button"
                    );

                    safeCall(
                        "createSphere"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           CYLINDER
           ===================================================== */

        const cylinderBtn =
            button("cylinderBtn");


        if (cylinderBtn) {

            cylinderBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Cylinder button"
                    );

                    safeCall(
                        "createCylinder"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           PYRAMID
           ===================================================== */

        const pyramidBtn =
            button("pyramidBtn");


        if (pyramidBtn) {

            pyramidBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Pyramid button"
                    );

                    safeCall(
                        "createPyramid"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           TORUS
           ===================================================== */

        const torusBtn =
            button("torusBtn");


        if (torusBtn) {

            torusBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Torus button"
                    );

                    safeCall(
                        "createTorus"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           STAR
           ===================================================== */

        const starBtn =
            button("starBtn");


        if (starBtn) {

            starBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Star button"
                    );

                    safeCall(
                        "createStar"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           DELETE
           ===================================================== */

        const deleteBtn =
            button("deleteBtn");


        if (deleteBtn) {

            deleteBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Delete button"
                    );

                    safeCall(
                        "deleteSelected"
                    );

                    setMode(
                        "EDIT"
                    );
                }
            );
        }


        /* =====================================================
           DUPLICATE
           ===================================================== */

        const duplicateBtn =
            button("duplicateBtn");


        if (duplicateBtn) {

            duplicateBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Duplicate button"
                    );

                    safeCall(
                        "duplicateObject"
                    );

                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           PHYSICS
           ===================================================== */

        const physicsBtn =
            button("physicsBtn");


        if (physicsBtn) {

            physicsBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Physics button"
                    );

                    safeCall(
                        "togglePhysics"
                    );

                    updatePhysicsButton();

                    setMode(
                        "PHYSICS"
                    );
                }
            );
        }


        /* =====================================================
           CLEAR
           ===================================================== */

        const resetBtn =
            button("resetBtn");


        if (resetBtn) {

            resetBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Clear button"
                    );

                    safeCall(
                        "clearScene"
                    );

                    setMode(
                        "IDLE"
                    );
                }
            );
        }


        /* =====================================================
           BUILD BUTTON
           ===================================================== */

        const buildBtn =
            button("buildBtn");


        if (buildBtn) {

            buildBtn.addEventListener(
                "click",
                function () {

                    const menu =
                        document.getElementById(
                            "objectMenu"
                        );


                    if (!menu) {
                        return;
                    }


                    if (
                        menu.classList.contains(
                            "open"
                        )
                    ) {

                        menu.classList.remove(
                            "open"
                        );

                        menu.style.display =
                            "none";

                    } else {

                        menu.classList.add(
                            "open"
                        );

                        menu.style.display =
                            "flex";
                    }


                    setMode(
                        "BUILD"
                    );
                }
            );
        }


        /* =====================================================
           CAMERA BUTTON
           ===================================================== */

        const cameraBtn =
            button("cameraBtn");


        if (cameraBtn) {

            cameraBtn.addEventListener(
                "click",
                function () {

                    console.log(
                        "JARVIS: Camera button"
                    );


                    /*
                       Use an existing camera
                       function if one exists.
                    */

                    if (
                        typeof window.switchCamera ===
                        "function"
                    ) {

                        window.switchCamera();

                        return;
                    }


                    if (
                        typeof window.toggleCamera ===
                        "function"
                    ) {

                        window.toggleCamera();

                        return;
                    }


                    /*
                       Otherwise try restarting
                       the hand camera.
                    */

                    if (
                        typeof window.startCamera ===
                        "function"
                    ) {

                        window.startCamera();

                        return;
                    }


                    console.warn(
                        "JARVIS: No camera switch function found"
                    );
                }
            );
        }


        /* =====================================================
           MODE
           ===================================================== */

        function setMode(mode) {

            const modeText =
                document.getElementById(
                    "modeText"
                );


            if (modeText) {

                modeText.textContent =
                    String(mode).toUpperCase();
            }


            const jarvisState =
                document.getElementById(
                    "jarvisState"
                );


            if (jarvisState) {

                jarvisState.textContent =
                    String(mode).toUpperCase();
            }
        }


        window.setJARVISMode =
            setMode;


        /* =====================================================
           PHYSICS BUTTON DISPLAY
           ===================================================== */

        function updatePhysicsButton() {

            const btn =
                document.getElementById(
                    "physicsBtn"
                );


            if (
                !btn ||
                !window.JARVIS_SCENE
            ) {
                return;
            }


            if (
                window.JARVIS_SCENE.physics
            ) {

                btn.textContent =
                    "PHY ON";

            } else {

                btn.textContent =
                    "PHY";
            }
        }


        window.updatePhysicsButton =
            updatePhysicsButton;


        /* =====================================================
           INITIALIZE MENU
           ===================================================== */

        const menu =
            document.getElementById(
                "objectMenu"
            );


        if (menu) {

            menu.style.display =
                "none";
        }


        /* =====================================================
           INITIAL STATUS
           ===================================================== */

        setMode(
            "IDLE"
        );


        updatePhysicsButton();


        /* =====================================================
           FORCE SCENE INITIALIZATION
           ===================================================== */

        if (
            typeof window.initScene ===
            "function"
        ) {

            window.initScene();

        } else {

            console.error(
                "JARVIS: initScene() not found"
            );
        }


        console.log(
            "JARVIS: ALL BUTTONS CONNECTED"
        );

    }
);

</script>
