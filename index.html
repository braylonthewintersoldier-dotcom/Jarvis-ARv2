<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS AR</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>


<body>

<div id="app">

    <!-- CAMERA -->
    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <!-- HAND TRACKING OVERLAY -->
    <canvas id="handCanvas"></canvas>


    <!-- 3D WORLD -->
    <canvas id="scene"></canvas>


    <!-- MINIMAL HUD -->
    <div id="hud">


        <!-- TOP -->
        <div class="topbar">

            <div class="logo">
                JARVIS
            </div>

            <div id="systemStatus">
                ● ONLINE
            </div>

        </div>


        <!-- SMALL LEFT TOOLBAR -->
        <div class="toolbar left">


            <button id="cameraBtn">
                CAM
            </button>


            <button id="buildBtn">
                BUILD
            </button>


            <button id="cubeBtn">
                +
            </button>


        </div>


        <!-- SMALL RIGHT TOOLBAR -->
        <div class="toolbar right">


            <button id="deleteBtn">
                DEL
            </button>


            <button id="duplicateBtn">
                DUP
            </button>


            <button id="physicsBtn">
                PHY
            </button>


            <button id="resetBtn">
                CLR
            </button>


        </div>


        <!-- SMALL OBJECT MENU -->
        <div id="objectMenu">


            <button id="sphereBtn">
                SPH
            </button>


            <button id="cylinderBtn">
                CYL
            </button>


            <button id="pyramidBtn">
                PYR
            </button>


            <button id="torusBtn">
                TOR
            </button>


        </div>


        <!-- RETICLE -->
        <div id="reticle"></div>


        <!-- JARVIS -->
        <div id="jarvisPanel">


            <div id="jarvisHeader">

                <span>
                    JARVIS
                </span>

                <span id="jarvisState">
                    READY
                </span>

            </div>


            <div id="chatOutput">

                <div class="jarvisLine">
                    Systems online.
                </div>

            </div>


            <div id="chatControls">

                <input
                    id="chatInput"
                    type="text"
                    placeholder="Ask JARVIS..."
                    autocomplete="off"
                >


                <button id="micBtn">
                    🎤
                </button>


                <button id="sendBtn">
                    →
                </button>

            </div>


        </div>


        <!-- STATUS -->
        <div id="status">

            <span>
                HANDS
                <b id="handText">0</b>
            </span>

            <span>
                OBJECTS
                <b id="objectText">0</b>
            </span>

            <span>
                <b id="modeText">IDLE</b>
            </span>

        </div>


    </div>

</div>


<script src="scene.js"></script>
<script src="handTracking.js"></script>
<script src="builder.js"></script>
<script src="voice.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>


</body>

</html>
